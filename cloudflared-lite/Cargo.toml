[package]
name = "cloudflared-lite"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal embeddable Cloudflare Tunnel client in Rust — named + quick tunnels, no cloudflared subprocess"
repository = "https://github.com/your-org/cloudflared-lite-rs"
rust-version = "1.86"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "io-util", "net", "time", "sync"] }
tracing = "0.1"
thiserror = "2"
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
httparse = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.7"

hickory-resolver = { version = "0.24", default-features = false, features = ["dns-over-rustls", "tokio-runtime", "system-config"] }

capnp = "0.20"
capnp-rpc = "0.20"
capnp-futures = "0.20"

tokio-util = { version = "0.7", features = ["compat"] }

bytes = "1"

[features]
default = []
metrics = []
